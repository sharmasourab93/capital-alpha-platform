repos:
  - repo: local
    hooks:
      - id: isort-all
        name: isort modified files
        entry: python -m isort
        language: system
        types: [python]
        stages: [pre-commit]

      - id: black-all
        name: black modified files
        entry: python -m black --line-length 79 --target-version py313
        language: system
        types: [python]
        stages: [pre-commit]
