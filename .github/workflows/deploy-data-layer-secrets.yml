name: Deploy Data Layer Secrets

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: AWS region.
        required: true
        default: ap-south-2
      upload_secret_value:
        description: Upload AngelOne secret value from GitHub secrets after stack deploy.
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Secrets Manager stack
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'qa' && 'int' || 'dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws_region }}

      - name: Validate template
        run: |
          aws cloudformation validate-template \
            --template-body file://infra/data_layer/cfn/secrets.yml

      - name: Deploy stack
        id: deploy_stack
        shell: bash
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            main) ENV_NAME="prod" ;;
            qa) ENV_NAME="int" ;;
            *) ENV_NAME="dev" ;;
          esac

          PARAM_FILE="infra/data_layer/params/secrets/secrets-${ENV_NAME}.json"
          STACK_NAME="capital-alpha-${ENV_NAME}-secrets"
          mapfile -t PARAM_OVERRIDES < <(jq -r '.[] | "\(.ParameterKey)=\(.ParameterValue)"' "$PARAM_FILE")

          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file infra/data_layer/cfn/secrets.yml \
            --parameter-overrides "${PARAM_OVERRIDES[@]}"

          SECRET_ARN="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='AngelOneSmartApiSecretArn'].OutputValue" \
            --output text)"

          echo "env_name=${ENV_NAME}" >> "$GITHUB_OUTPUT"
          echo "stack_name=${STACK_NAME}" >> "$GITHUB_OUTPUT"
          echo "secret_arn=${SECRET_ARN}" >> "$GITHUB_OUTPUT"

      - name: Upload AngelOne secret value
        if: ${{ inputs.upload_secret_value == 'true' }}
        shell: bash
        env:
          ANGELONE_API_KEY: ${{ secrets.ANGELONE_API_KEY }}
          ANGELONE_API_SECRET: ${{ secrets.ANGELONE_API_SECRET }}
          ANGELONE_CLIENTCODE: ${{ secrets.ANGELONE_CLIENTCODE }}
          ANGELONE_PASSWORD: ${{ secrets.ANGELONE_PASSWORD }}
          ANGELONE_TOTP_SECRET: ${{ secrets.ANGELONE_TOTP_SECRET }}
        run: |
          set -euo pipefail

          for secret_name in \
            ANGELONE_API_KEY \
            ANGELONE_API_SECRET \
            ANGELONE_CLIENTCODE \
            ANGELONE_PASSWORD \
            ANGELONE_TOTP_SECRET
          do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Missing GitHub secret: ${secret_name}"
              exit 1
            fi
          done

          ANGELONE_SECRET_JSON="$(jq -nc \
            --arg api_key "$ANGELONE_API_KEY" \
            --arg api_secret "$ANGELONE_API_SECRET" \
            --arg client_code "$ANGELONE_CLIENTCODE" \
            --arg password "$ANGELONE_PASSWORD" \
            --arg totp_secret "$ANGELONE_TOTP_SECRET" \
            '{
              api_key: $api_key,
              api_secret: $api_secret,
              client_code: $client_code,
              password: $password,
              totp_secret: $totp_secret
            }')"

          aws secretsmanager put-secret-value \
            --secret-id "${{ steps.deploy_stack.outputs.secret_arn }}" \
            --secret-string "$ANGELONE_SECRET_JSON" >/dev/null

          echo "Uploaded AngelOne secret value for ${{ steps.deploy_stack.outputs.env_name }}."
