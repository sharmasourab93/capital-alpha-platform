name: Deploy Data Layer S3 Artifacts

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: AWS region.
        required: true
        default: ap-south-2

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy S3 artifact stack
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'qa' && 'int' || 'dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws_region }}

      - name: Validate template
        run: |
          aws cloudformation validate-template \
            --template-body file://infra/data_layer/cfn/s3.yml

      - name: Deploy stack
        shell: bash
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            main) ENV_NAME="prod" ;;
            qa) ENV_NAME="int" ;;
            *) ENV_NAME="dev" ;;
          esac
          PARAM_FILE="infra/data_layer/params/s3/s3-${ENV_NAME}.json"
          STACK_NAME="capital-alpha-${ENV_NAME}-artifacts"
          mapfile -t PARAM_OVERRIDES < <(jq -r '.[] | "\(.ParameterKey)=\(.ParameterValue)"' "$PARAM_FILE")

          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file infra/data_layer/cfn/s3.yml \
            --parameter-overrides "${PARAM_OVERRIDES[@]}"
