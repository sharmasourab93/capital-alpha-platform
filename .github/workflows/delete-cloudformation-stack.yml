name: Delete CloudFormation Stack

on:
  workflow_dispatch:
    inputs:
      stack_name:
        description: CloudFormation stack name to delete.
        required: true
      aws_region:
        description: AWS region.
        required: true
        default: ap-south-2

permissions:
  contents: read

jobs:
  delete:
    name: Delete stack
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'qa' && 'int' || 'dev' }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws_region }}

      - name: Resolve deployment environment
        id: deployment_env
        shell: bash
        run: |
          set -euo pipefail

          case "${GITHUB_REF_NAME}" in
            main) ENV_NAME="prod" ;;
            qa) ENV_NAME="int" ;;
            *) ENV_NAME="dev" ;;
          esac

          echo "env_name=${ENV_NAME}" >> "$GITHUB_OUTPUT"

      - name: Validate stack name
        shell: bash
        run: |
          set -euo pipefail

          STACK_NAME="${{ inputs.stack_name }}"
          ENV_NAME="${{ steps.deployment_env.outputs.env_name }}"

          if [[ "$STACK_NAME" != capital-alpha-"${ENV_NAME}"-* ]]; then
            echo "::error::Branch ${GITHUB_REF_NAME} can only delete capital-alpha-${ENV_NAME}-* stacks."
            exit 1
          fi

      - name: Check stack status
        id: stack_status
        shell: bash
        run: |
          set -euo pipefail

          STACK_NAME="${{ inputs.stack_name }}"

          STACK_STATUS="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || true)"

          if [[ -z "$STACK_STATUS" ]]; then
            echo "::error::Stack not found: ${STACK_NAME}"
            exit 1
          fi

          echo "stack_status=${STACK_STATUS}" >> "$GITHUB_OUTPUT"

      - name: Delete stack
        shell: bash
        run: |
          set -euo pipefail

          STACK_NAME="${{ inputs.stack_name }}"
          STACK_STATUS="${{ steps.stack_status.outputs.stack_status }}"

          echo "Deleting stack ${STACK_NAME} with current status ${STACK_STATUS}"
          aws cloudformation delete-stack --stack-name "$STACK_NAME"

      - name: Wait for stack deletion
        shell: bash
        run: |
          set -euo pipefail

          STACK_NAME="${{ inputs.stack_name }}"

          aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME"
          echo "Deleted stack ${STACK_NAME}"
