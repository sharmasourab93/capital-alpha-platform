name: Deploy Data Layer Lambda

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: AWS region.
        required: true
        default: ap-south-2
      function_suffix:
        description: Lambda function suffix used by the stack.
        required: true
        default: data-layer-rest

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Lambda stack
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'qa' && 'int' || 'dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve deployment context
        id: deployment_context
        shell: bash
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            main) ENV_NAME="prod" ;;
            qa) ENV_NAME="int" ;;
            *) ENV_NAME="dev" ;;
          esac

          FUNCTION_SUFFIX="${{ inputs.function_suffix }}"
          ARTIFACT_KEY="lambda/${FUNCTION_SUFFIX}/${GITHUB_SHA}.zip"

          echo "env_name=${ENV_NAME}" >> "$GITHUB_OUTPUT"
          echo "function_suffix=${FUNCTION_SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "artifact_key=${ARTIFACT_KEY}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws_region }}

      - name: Build Lambda zip
        shell: bash
        run: |
          set -euo pipefail
          rm -rf lambda_build capital-alpha-data-layer-rest-lambda.zip
          mkdir lambda_build
          python -m pip install --upgrade pip
          python -m pip install --target lambda_build -r data_layer/requirements-lambda.txt
          rsync -a \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '*.pyo' \
            --exclude 'logs' \
            data_layer/ lambda_build/data_layer/
          cd lambda_build
          zip -r ../capital-alpha-data-layer-rest-lambda.zip .

      - name: Resolve artifact bucket
        id: artifact_bucket
        shell: bash
        run: |
          set -euo pipefail
          BUCKET_NAME="$(aws cloudformation describe-stacks \
            --stack-name "capital-alpha-${{ steps.deployment_context.outputs.env_name }}-artifacts" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaArtifactBucketName'].OutputValue" \
            --output text)"
          echo "bucket_name=${BUCKET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload Lambda zip
        run: |
          aws s3 cp capital-alpha-data-layer-rest-lambda.zip \
            "s3://${{ steps.artifact_bucket.outputs.bucket_name }}/${{ steps.deployment_context.outputs.artifact_key }}"

      - name: Validate template
        run: |
          aws cloudformation validate-template \
            --template-body file://infra/data_layer/cfn/lambda.yml

      - name: Deploy stack
        shell: bash
        env:
          ANGELONE_API_KEY: ${{ secrets.ANGELONE_API_KEY }}
          ANGELONE_API_SECRET: ${{ secrets.ANGELONE_API_SECRET }}
          ANGELONE_CLIENTCODE: ${{ secrets.ANGELONE_CLIENTCODE }}
          ANGELONE_PASSWORD: ${{ secrets.ANGELONE_PASSWORD }}
          ANGELONE_TOTP_SECRET: ${{ secrets.ANGELONE_TOTP_SECRET }}
        run: |
          set -euo pipefail
          ENV_NAME="${{ steps.deployment_context.outputs.env_name }}"
          FUNCTION_SUFFIX="${{ steps.deployment_context.outputs.function_suffix }}"
          ARTIFACT_KEY="${{ steps.deployment_context.outputs.artifact_key }}"
          PARAM_FILE="infra/data_layer/params/lambda/lambda-${ENV_NAME}.json"
          STACK_NAME="capital-alpha-${ENV_NAME}-${FUNCTION_SUFFIX}-lambda"
          mapfile -t PARAM_OVERRIDES < <(jq -r '.[] | "\(.ParameterKey)=\(.ParameterValue)"' "$PARAM_FILE")

          for secret_name in \
            ANGELONE_API_KEY \
            ANGELONE_API_SECRET \
            ANGELONE_CLIENTCODE \
            ANGELONE_PASSWORD \
            ANGELONE_TOTP_SECRET
          do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Missing GitHub secret: ${secret_name}"
              exit 1
            fi
          done

          PARAM_OVERRIDES+=(
            "PythonUnbuffered=1"
            "FunctionNameSuffix=${FUNCTION_SUFFIX}"
            "CodeS3Key=${ARTIFACT_KEY}"
            "AngelOneApiKey=${ANGELONE_API_KEY}"
            "AngelOneApiSecret=${ANGELONE_API_SECRET}"
            "AngelOneClientCode=${ANGELONE_CLIENTCODE}"
            "AngelOnePassword=${ANGELONE_PASSWORD}"
            "AngelOneTotpSecret=${ANGELONE_TOTP_SECRET}"
          )

          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file infra/data_layer/cfn/lambda.yml \
            --parameter-overrides "${PARAM_OVERRIDES[@]}" \
            --capabilities CAPABILITY_NAMED_IAM
