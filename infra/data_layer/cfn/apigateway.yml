AWSTemplateFormatVersion: "2010-09-09"
Description: API Gateway HTTP API for Capital Alpha data-layer Lambda.

Parameters:
  ProjectName:
    Type: String
    Default: capital-alpha
    AllowedValues:
      - capital-alpha
    Description: Project prefix used to name resources.

  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - int
      - prod
    Description: Deployment environment.

  ApiNameSuffix:
    Type: String
    Default: data-layer-rest-api
    AllowedPattern: "^[a-z0-9][a-z0-9-]{2,48}$"
    Description: API-specific name suffix.

  FunctionNameSuffix:
    Type: String
    Default: data-layer-rest
    AllowedPattern: "^[a-z0-9][a-z0-9-]{2,48}$"
    Description: Lambda function suffix exported by the Lambda stack.

  StageName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - int
      - prod
    Description: API Gateway stage name.

  OpenApiS3BucketName:
    Type: String
    Default: ""
    Description: Optional bucket containing rendered OpenAPI YAML. If empty, imports the artifact bucket.

  OpenApiS3Key:
    Type: String
    Default: openapi/data-layer-rest.openapi.yaml
    Description: S3 key for the rendered OpenAPI YAML document.

  OpenApiS3ObjectVersion:
    Type: String
    Default: ""
    Description: Optional S3 object version for deterministic API deployments.

  AccessLogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
      - 60
      - 90
      - 120
      - 150
      - 180
      - 365
    Description: API Gateway access log retention in days.

  ThrottlingBurstLimit:
    Type: Number
    Default: 20
    MinValue: 1
    MaxValue: 5000
    Description: Default route burst throttling limit.

  ThrottlingRateLimit:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 10000
    Description: Default route steady-state throttling rate per second.

Conditions:
  HasOpenApiS3BucketName: !Not [!Equals [!Ref OpenApiS3BucketName, ""]]
  HasOpenApiS3ObjectVersion: !Not [!Equals [!Ref OpenApiS3ObjectVersion, ""]]

Resources:
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/${ProjectName}-${EnvironmentName}-${ApiNameSuffix}"
      RetentionInDays: !Ref AccessLogRetentionDays
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-${ApiNameSuffix}-logs"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      BodyS3Location:
        Bucket: !If
          - HasOpenApiS3BucketName
          - !Ref OpenApiS3BucketName
          - Fn::ImportValue: !Sub "${ProjectName}-${EnvironmentName}-lambda-artifact-bucket-name"
        Key: !Ref OpenApiS3Key
        Version: !If
          - HasOpenApiS3ObjectVersion
          - !Ref OpenApiS3ObjectVersion
          - !Ref AWS::NoValue
      FailOnWarnings: true

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: !Ref StageName
      AutoDeploy: true
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","routeKey":"$context.routeKey","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength","integrationError":"$context.integrationErrorMessage"}
      DefaultRouteSettings:
        DetailedMetricsEnabled: true
        ThrottlingBurstLimit: !Ref ThrottlingBurstLimit
        ThrottlingRateLimit: !Ref ThrottlingRateLimit
      Tags:
        Name: !Sub "${ProjectName}-${EnvironmentName}-${ApiNameSuffix}-${StageName}"
        Project: !Ref ProjectName
        Environment: !Ref EnvironmentName

  ApiGatewayInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Fn::ImportValue: !Sub "${ProjectName}-${EnvironmentName}-${FunctionNameSuffix}-lambda-arn"
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/*"

Outputs:
  ApiId:
    Description: API Gateway HTTP API ID.
    Value: !Ref HttpApi
    Export:
      Name: !Sub "${ProjectName}-${EnvironmentName}-${ApiNameSuffix}-id"

  ApiEndpoint:
    Description: Base API endpoint.
    Value: !GetAtt HttpApi.ApiEndpoint
    Export:
      Name: !Sub "${ProjectName}-${EnvironmentName}-${ApiNameSuffix}-endpoint"

  StageUrl:
    Description: Stage-qualified API URL.
    Value: !Sub "${HttpApi.ApiEndpoint}/${StageName}"
    Export:
      Name: !Sub "${ProjectName}-${EnvironmentName}-${ApiNameSuffix}-stage-url"
