AWSTemplateFormatVersion: "2010-09-09"
Description: Secrets Manager resources for Capital Alpha data layer credentials.

Parameters:
  ProjectName:
    Type: String
    Default: capital-alpha
    AllowedValues:
      - capital-alpha
    Description: Project prefix used to name resources.

  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - int
      - prod
    Description: Deployment environment.

  SecretNameSuffix:
    Type: String
    Default: angelone/smartapi
    AllowedPattern: "^[a-zA-Z0-9/_+=.@-]{1,128}$"
    Description: Path-like suffix for the AngelOne SmartAPI secret name.

Resources:
  AngelOneSmartApiSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "${ProjectName}/${EnvironmentName}/${SecretNameSuffix}"
      Description: !Sub "AngelOne SmartAPI credentials for ${ProjectName} ${EnvironmentName}."
      GenerateSecretString:
        SecretStringTemplate: "{}"
        GenerateStringKey: placeholder
        PasswordLength: 32
        ExcludePunctuation: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-angelone-smartapi-secret"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Broker
          Value: angelone

Outputs:
  AngelOneSmartApiSecretName:
    Description: AngelOne SmartAPI secret name.
    Value: !Ref AngelOneSmartApiSecret
    Export:
      Name: !Sub "${ProjectName}-${EnvironmentName}-angelone-smartapi-secret-name"

  AngelOneSmartApiSecretArn:
    Description: AngelOne SmartAPI secret ARN.
    Value: !Ref AngelOneSmartApiSecret
    Export:
      Name: !Sub "${ProjectName}-${EnvironmentName}-angelone-smartapi-secret-arn"
