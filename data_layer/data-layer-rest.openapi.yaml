openapi: 3.0.1
info:
  title: Capital Alpha Data Layer API
  version: 1.0.0
tags:
  - name: health
    description: Runtime health endpoints.
  - name: market
    description: Market data and broker discovery endpoints.
  - name: account
    description: Broker account endpoints.
  - name: fundamentals
    description: Reserved fundamental data endpoints.

paths:
  /health:
    get:
      tags:
        - health
      operationId: health
      responses:
        "200":
          description: Runtime health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: __LAMBDA_INVOKE_URI__
        payloadFormatVersion: "2.0"

  /brokers:
    get:
      tags:
        - market
      operationId: listBrokersCompat
      responses:
        "200":
          $ref: "#/components/responses/BrokerList"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: __LAMBDA_INVOKE_URI__
        payloadFormatVersion: "2.0"

  /market/brokers:
    get:
      tags:
        - market
      operationId: listMarketBrokers
      responses:
        "200":
          $ref: "#/components/responses/BrokerList"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: __LAMBDA_INVOKE_URI__
        payloadFormatVersion: "2.0"

  /market/{broker}/{exchange}/intervals:
    get:
      tags:
        - market
      operationId: getIntervals
      parameters:
        - $ref: "#/components/parameters/BrokerPath"
        - $ref: "#/components/parameters/ExchangePath"
      responses:
        "200":
          description: Supported candle intervals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntervalsResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: __LAMBDA_INVOKE_URI__
        payloadFormatVersion: "2.0"

  /market/{broker}/{exchange}/scrips:
    get:
      tags:
        - market
      operationId: getAllScrips
      parameters:
        - $ref: "#/components/parameters/BrokerPath"
        - $ref: "#/components/parameters/ExchangePath"
      responses:
        "200":
          description: Broker scrip list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerResponse"
        "404":
          $ref: "#/components/responses/BrokerNotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          $ref: "#/components/responses/BrokerOperationError"
        "503":
          $ref: "#/components/responses/BrokerUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: __LAMBDA_INVOKE_URI__
        payloadFormatVersion: "2.0"

  /market/{broker}/{exchange}/ltp:
    get:
      tags:
        - market
      operationId: getLtp
      parameters:
        - $ref: "#/components/parameters/BrokerPath"
        - $ref: "#/components/parameters/ExchangePath"
        - name: symbol
          in: query
          required: true
          description: Single symbol or comma-separated symbols.
          schema:
            type: string
      responses:
        "200":
          description: Last traded price.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerResponse"
        "404":
          $ref: "#/components/responses/BrokerNotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          $ref: "#/components/responses/BrokerOperationError"
        "503":
          $ref: "#/components/responses/BrokerUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: __LAMBDA_INVOKE_URI__
        payloadFormatVersion: "2.0"

  /market/{broker}/{exchange}/quotes:
    post:
      tags:
        - market
      operationId: getQuotes
      parameters:
        - $ref: "#/components/parameters/BrokerPath"
        - $ref: "#/components/parameters/ExchangePath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuotePayload"
      responses:
        "200":
          description: Quote data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerResponse"
        "404":
          $ref: "#/components/responses/BrokerNotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          $ref: "#/components/responses/BrokerOperationError"
        "503":
          $ref: "#/components/responses/BrokerUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: __LAMBDA_INVOKE_URI__
        payloadFormatVersion: "2.0"

  /market/{broker}/{exchange}/candles:
    post:
      tags:
        - market
      operationId: getCandles
      parameters:
        - $ref: "#/components/parameters/BrokerPath"
        - $ref: "#/components/parameters/ExchangePath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandlePayload"
      responses:
        "200":
          description: Candle data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerResponse"
        "404":
          $ref: "#/components/responses/BrokerNotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          $ref: "#/components/responses/BrokerOperationError"
        "503":
          $ref: "#/components/responses/BrokerUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: __LAMBDA_INVOKE_URI__
        payloadFormatVersion: "2.0"

  /account/{broker}/profile:
    get:
      tags:
        - account
      operationId: getProfile
      parameters:
        - $ref: "#/components/parameters/BrokerPath"
      responses:
        "200":
          $ref: "#/components/responses/AccountBrokerResponse"
        "404":
          $ref: "#/components/responses/BrokerNotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          $ref: "#/components/responses/BrokerOperationError"
        "503":
          $ref: "#/components/responses/BrokerUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: __LAMBDA_INVOKE_URI__
        payloadFormatVersion: "2.0"

  /account/{broker}/funds:
    get:
      tags:
        - account
      operationId: getFunds
      parameters:
        - $ref: "#/components/parameters/BrokerPath"
      responses:
        "200":
          $ref: "#/components/responses/AccountBrokerResponse"
        "404":
          $ref: "#/components/responses/BrokerNotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          $ref: "#/components/responses/BrokerOperationError"
        "503":
          $ref: "#/components/responses/BrokerUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: __LAMBDA_INVOKE_URI__
        payloadFormatVersion: "2.0"

  /account/{broker}/holdings:
    get:
      tags:
        - account
      operationId: getHoldings
      parameters:
        - $ref: "#/components/parameters/BrokerPath"
      responses:
        "200":
          $ref: "#/components/responses/AccountBrokerResponse"
        "404":
          $ref: "#/components/responses/BrokerNotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          $ref: "#/components/responses/BrokerOperationError"
        "503":
          $ref: "#/components/responses/BrokerUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: __LAMBDA_INVOKE_URI__
        payloadFormatVersion: "2.0"

  /account/{broker}/positions:
    get:
      tags:
        - account
      operationId: getPositions
      parameters:
        - $ref: "#/components/parameters/BrokerPath"
      responses:
        "200":
          $ref: "#/components/responses/AccountBrokerResponse"
        "404":
          $ref: "#/components/responses/BrokerNotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          $ref: "#/components/responses/BrokerOperationError"
        "503":
          $ref: "#/components/responses/BrokerUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: __LAMBDA_INVOKE_URI__
        payloadFormatVersion: "2.0"

  /account/{broker}/orders:
    get:
      tags:
        - account
      operationId: getOrders
      parameters:
        - $ref: "#/components/parameters/BrokerPath"
      responses:
        "200":
          $ref: "#/components/responses/AccountBrokerResponse"
        "404":
          $ref: "#/components/responses/BrokerNotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          $ref: "#/components/responses/BrokerOperationError"
        "503":
          $ref: "#/components/responses/BrokerUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: __LAMBDA_INVOKE_URI__
        payloadFormatVersion: "2.0"

  /account/{broker}/trades:
    get:
      tags:
        - account
      operationId: getTrades
      parameters:
        - $ref: "#/components/parameters/BrokerPath"
      responses:
        "200":
          $ref: "#/components/responses/AccountBrokerResponse"
        "404":
          $ref: "#/components/responses/BrokerNotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          $ref: "#/components/responses/BrokerOperationError"
        "503":
          $ref: "#/components/responses/BrokerUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: __LAMBDA_INVOKE_URI__
        payloadFormatVersion: "2.0"

  /funda/{market}:
    get:
      tags:
        - fundamentals
      operationId: fundamentalsNamespace
      parameters:
        - name: market
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reserved fundamentals namespace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundamentalsNamespaceResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: __LAMBDA_INVOKE_URI__
        payloadFormatVersion: "2.0"

components:
  parameters:
    BrokerPath:
      name: broker
      in: path
      required: true
      schema:
        type: string
    ExchangePath:
      name: exchange
      in: path
      required: true
      schema:
        type: string

  responses:
    BrokerList:
      description: Registered brokers.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BrokerListResponse"
    AccountBrokerResponse:
      description: Account operation response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AccountBrokerResponse"
    BrokerNotFound:
      description: Broker is not registered.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BrokerOperationError:
      description: Broker operation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BrokerUnavailable:
      description: Broker adapter is unavailable or misconfigured.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok

    BrokerListResponse:
      type: object
      required:
        - brokers
      properties:
        brokers:
          type: array
          items:
            type: string

    Interval:
      type: object
      required:
        - label
        - value
      properties:
        label:
          type: string
          example: 1m
        value:
          type: string
          example: ONE_MINUTE

    IntervalsResponse:
      type: object
      required:
        - broker
        - exchange
        - intervals
      properties:
        broker:
          type: string
        exchange:
          type: string
        intervals:
          type: array
          items:
            $ref: "#/components/schemas/Interval"

    BrokerResponse:
      type: object
      required:
        - broker
        - operation
        - success
        - data
      properties:
        broker:
          type: string
        operation:
          type: string
        success:
          type: boolean
        data:
          description: Canonical broker operation payload.
        message:
          type: string
          nullable: true
        error_code:
          type: string
          nullable: true

    AccountBrokerResponse:
      allOf:
        - $ref: "#/components/schemas/BrokerResponse"
        - type: object
          required:
            - status
          properties:
            status:
              type: string
              example: work_in_progress

    FundamentalsNamespaceResponse:
      type: object
      required:
        - market
        - status
        - message
      properties:
        market:
          type: string
        status:
          type: string
          example: work_in_progress
        message:
          type: string

    QuotePayload:
      type: object
      required:
        - symbols
      properties:
        symbols:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
        mode:
          type: string
          enum:
            - LTP
            - OHLC
            - FULL
          default: FULL

    CandlePayload:
      type: object
      required:
        - symbol
        - interval
        - from_time
        - to_time
      properties:
        symbol:
          type: string
        interval:
          type: string
        from_time:
          type: string
        to_time:
          type: string

    ErrorResponse:
      type: object
      required:
        - detail
      properties:
        detail:
          $ref: "#/components/schemas/ErrorDetail"

    ErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
          nullable: true
